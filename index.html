<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 1–9 แฟลชการ์ด</title>
<meta name="description" content="แฟลชการ์ดคำศัพท์ภาษาจีน HSK 1–9 ครบ 11,000 คำ พร้อมตัวเต็ม พินอิน และระบบทบทวนแบบเว้นระยะ">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{
  --bg:#F4F2EE; --card:#FFFFFF; --ink:#1C1B1A; --muted:#5E5A54; --line:#E4E1DA; --chip:#F3F1EC;
  --accent:#B3341F; --accent-soft:#FBF3EF; --good:#1F6F4A; --hard:#8A5A00;
  --t1:#C0392B; --t2:#B26A00; --t3:#1E7A46; --t4:#2F55B5; --t5:#6B665F;
  --zh:'LXGW WenKai TC','Ma Shan Zheng','Noto Serif TC',serif;
  --ui:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
.app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:16px 16px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand .seal{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--zh);font-size:20px}
.streak{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.tabs .in{max-width:620px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center}
.stat b{display:block;font-family:Inter,sans-serif;font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
h2{font-size:15px;margin:6px 4px 0;color:var(--muted);font-weight:600}
.btn{min-height:48px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 20px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lv{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:44px}
.lv[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lv .name{display:flex;justify-content:space-between;font-weight:600}
.lv .name small{font-weight:400;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:99px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)}.bar .l{background:#E0A43A}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
/* card */
.study{display:flex;flex-direction:column;gap:12px}
.progress{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:0 4px}
.fc{background:#fff;border:1px solid var(--line);border-radius:28px;padding:24px 22px;min-height:520px;display:flex;flex-direction:column;gap:14px;position:relative}
.fc .tag{font-family:Inter,sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;color:#fff;background:var(--accent);padding:5px 11px;border-radius:999px}
.fc .head{display:flex;justify-content:space-between;align-items:center}
.front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.zh-big{font-family:var(--zh);font-weight:700;line-height:1.05;letter-spacing:.05em;word-break:keep-all}
.zh-trad{font-family:var(--zh);color:var(--muted)}
.hint{font-size:15px;color:var(--muted)}
.mean-big{font-size:26px;font-weight:600;line-height:1.35}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.back-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.py{font-family:Inter,sans-serif;font-size:26px;font-weight:600}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:8px;padding:3px 10px;font-size:13px}
.sec{border-top:1px solid #ECE9E3;padding-top:12px;display:flex;flex-direction:column;gap:3px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;color:#6B665F}
.th{font-size:21px;font-weight:600}
.en{font-family:Inter,sans-serif;font-size:14px;color:var(--muted)}
.ex-zh{font-family:var(--zh);font-size:21px}
.ex-zh b{color:var(--accent);font-weight:700}
.small{font-size:14px;color:#3F3C38}
.tw{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rate button{min-height:58px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:500;gap:1px}
.rate button small{font-size:11px;color:var(--muted);font-weight:400;font-family:Inter,sans-serif}
.rate .again{border-color:#E8B4AA;color:#8A2414}
.rate .good{background:var(--ink);color:#fff;border-color:var(--ink)}.rate .good small{color:#D9D5CD}
.kbd{font-size:12px;color:var(--muted);text-align:center}
/* browse */
.search{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);padding:0 16px;font-size:16px;font-family:inherit;background:#fff}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 14px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.list{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:none;border-bottom:1px solid #F0EDE7;background:#fff;text-align:left;cursor:pointer;min-height:56px}
.item:last-child{border-bottom:none}
.item .w{font-family:var(--zh);font-size:24px;min-width:64px}
.item .w small{font-size:15px;color:var(--muted);margin-left:4px}
.item .m{font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .m .p{font-family:Inter,sans-serif;color:var(--muted);font-size:13px;display:block}
.dot{width:10px;height:10px;border-radius:50%;background:var(--chip)}
.dot.l{background:#E0A43A}.dot.m{background:var(--good)}
.more{padding:12px;text-align:center}
/* settings */
.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F0EDE7}
.field:last-child{border-bottom:none}
.field label{font-size:15px}
.field small{display:block;color:var(--muted);font-size:13px}
select,input[type=number]{min-height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font-size:15px;font-family:inherit;background:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:none;background:#fff;min-height:40px;padding:0 14px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.done{text-align:center;padding:40px 20px}
.done .zh-big{font-size:72px;color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(28,27,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.modal .fc{width:100%;max-width:600px;max-height:92vh;overflow:auto}
.close{position:absolute;top:14px;right:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (min-width:700px){.modal{align-items:center}}
</style>
</head>

function preview(c, g){ // returns interval (days) for grade g: 0 again 1 hard 2 good 3 easy
  if(!c || c.i===0){ return [MIN*1, MIN*6, 1, 4][g]; }
  const e = c.e;
  if(g===0) return MIN*10;
  if(g===1) return Math.max(1, c.i*1.2);
  if(g===2) return Math.max(c.i+1, c.i*e);
  return Math.max(c.i+2, c.i*e*1.3);
}
function grade(id, g){
  const t=today(); let c=S.cards[id];
  const isNew=!c;
  if(!c) c={i:0,e:2.5,r:0,lp:0,due:t,first:t};
  const iv=preview(c,g);
  if(g===0){ c.lp+= (c.i>0?1:0); c.e=Math.max(1.3,c.e-0.2); c.i=0; }
  else { if(g===1) c.e=Math.max(1.3,c.e-0.15); if(g===3) c.e+=0.15; c.i = iv>=1 ? iv : 0; c.r++; }
  c.due = iv>=1 ? t+Math.round(iv) : t;
  S.cards[id]=c;
  const L = S.log[t] || (S.log[t]={n:0,r:0});
  if(isNew) L.n++; else L.r++;
  if(S.streak.last!==t){ S.streak.n = (S.streak.last===t-1) ? S.streak.n+1 : 1; S.streak.last=t; }
  save();
  return iv;
}
function fmt(iv){
  if(iv<1){ const m=Math.round(iv*1440); return m<60? m+' นาที' : Math.round(m/60)+' ชม.'; }
  const d=Math.round(iv); if(d<30) return d+' วัน'; if(d<365) return (d/30).toFixed(d<60?1:0)+' เดือน'; return (d/365).toFixed(1)+' ปี';
}
function inLevels(w){ return S.settings.levels.includes(w.l); }
function dueList(){ const t=today(); return W.filter(w=>{const c=S.cards[w.id]; return c && c.due<=t && inLevels(w);}); }
function newToday(){ return (S.log[today()]||{n:0}).n; }
function newList(n){ const out=[]; for(const w of W){ if(out.length>=n) break; if(!S.cards[w.id] && inLevels(w)) out.push(w);} return out; }
function levelStats(l){ let tot=0,le=0,ma=0; for(const w of W){ if(w.l!==l) continue; tot++; const c=S.cards[w.id]; if(c){ if(isLearned(c)) ma++; else le++; } } return {tot,le,ma}; }

const TONE = {'ā':1,'ē':1,'ī':1,'ō':1,'ū':1,'ǖ':1,'á':2,'é':2,'í':2,'ó':2,'ú':2,'ǘ':2,'ǎ':3,'ě':3,'ǐ':3,'ǒ':3,'ǔ':3,'ǚ':3,'à':4,'è':4,'ì':4,'ò':4,'ù':4,'ǜ':4};
const V='aeiouüvāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ';
const SYL = new RegExp('(?:zh|ch|sh|[bpmfdtnlgkhjqxzcsrwy])?['+V+']+(?:ng(?!['+V+'])|n(?!['+V+'])|r(?!['+V+']))?','gi');
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toneHTML(p){
  let out='',last=0; p=String(p);
  p.replace(SYL,(m,off)=>{ out+=esc(p.slice(last,off)); let t=5; for(const ch of m){ if(TONE[ch.toLowerCase()]){t=TONE[ch.toLowerCase()];break;} } out+='<span class="t'+t+'">'+esc(m)+'</span>'; last=off+m.length; return m; });
  return out+esc(p.slice(last));
}

let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh/i.test(v.lang)) || null; }catch(e){} }
try{ speechSynthesis.onvoiceschanged=pickVoice; pickVoice(); }catch(e){}
function speak(text){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang = voice? voice.lang : 'zh-TW'; if(voice) u.voice=voice; u.rate=0.85; speechSynthesis.speak(u);}catch(e){ toast('อุปกรณ์นี้ไม่รองรับเสียงอ่าน'); } }

function toast(msg){ const d=document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

// session
let Q=[], cur=null, flipped=false, sessDone=0;
function startSession(){
  const due=dueList().sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  const nleft=Math.max(0,S.settings.newPerDay-newToday());
  const nw=newList(nleft);
  // แทรกคำใหม่สลับกับคำทบทวน
  Q=[]; let i=0,j=0; while(i<due.length||j<nw.length){ if(i<due.length) Q.push(due[i++]); if(i<due.length) Q.push(due[i++]); if(j<nw.length) Q.push(nw[j++]); }
  sessDone=0; next();
}
function next(){ cur=Q.shift()||null; flipped=false; if(cur && S.settings.autoSpeak && S.settings.mode!=='en') setTimeout(()=>speak(cur.s),150); }
function renderStudy(){
  if(!cur && !Q.length){ startSession(); }
  if(!cur){
    app.innerHTML = header()+`<div class="panel done"><div class="zh-big">完成</div><p class="th" style="margin:10px 0 4px">ทบทวนรอบนี้ครบแล้ว</p><p class="small" style="color:var(--muted)">วันนี้ทำไป ${sessDone} ใบ กลับมาใหม่พรุ่งนี้ หรือเพิ่มคำใหม่ต่อวันในหน้าตั้งค่า</p><button class="btn primary" id="home" style="margin-top:12px">กลับหน้าหลัก</button></div>`;
    app.querySelector('#home').onclick=()=>{tab='home';render();}; return;
  }
  const w=cur, c=S.cards[w.id], isNew=!c, mode=S.settings.mode;
  let front='';
  if(mode==='zh'){ const alt=wordAlt(w); front=`<span class="zh-big" style="font-size:${bigSize(wordMain(w))}px">${esc(wordMain(w))}</span>${alt?`<span class="zh-trad" style="font-size:44px">(${esc(alt)})</span>`:''}<span class="hint">นึกพินอินและความหมายก่อน แล้วค่อยพลิกดู</span>`; }
  else if(mode==='en'){ front=`<span class="mean-big">${esc(meaning(w))}</span>${w.th?`<span class="en">${esc(w.en)}</span>`:''}<span class="chips" style="justify-content:center">${w.pos.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</span><span class="hint">ภาษาจีนคือคำว่าอะไร? ลองเขียนหรือพูดออกมา</span>`; }
  else { front=`<button class="icon-btn" data-speak="${esc(w.s)}" style="width:96px;height:96px" aria-label="ฟังอีกครั้ง">${SPK.replace('<svg','<svg style="width:40px;height:40px"')}</button><span class="hint">ฟังแล้วนึกว่าเป็นคำว่าอะไร</span>`; }
  const ivs=[0,1,2,3].map(g=>fmt(preview(c,g)));
  app.innerHTML = header()+`<div class="study">
    <div class="progress"><span>${isNew?'คำใหม่':'ทบทวน'} · ${LVNAME(w.l)}</span><span>เหลือ ${Q.length+1} ใบ</span></div>
    <article class="fc" aria-live="polite">
      <div class="head"><span class="tag">${LVNAME(w.l)}</span>${flipped?'':`<button class="icon-btn" data-speak="${esc(w.s)}" aria-label="ฟังเสียง">${SPK}</button>`}</div>
      ${flipped? backHTML(w) : `<div class="front">${front}</div>`}
    </article>
    ${flipped? `<div class="rate" role="group" aria-label="ให้คะแนนว่าจำได้แค่ไหน">
      <button class="again" data-g="0">ลืม<small>${ivs[0]}</small></button>
      <button data-g="1">ยาก<small>${ivs[1]}</small></button>
      <button class="good" data-g="2">จำได้<small>${ivs[2]}</small></button>
      <button data-g="3">ง่ายมาก<small>${ivs[3]}</small></button></div>
      <p class="kbd">คีย์ลัด: 1 ลืม · 2 ยาก · 3 จำได้ · 4 ง่ายมาก · P ฟังเสียง</p>`
    : `<button class="btn primary block" id="flip" style="min-height:56px">พลิกการ์ด</button><p class="kbd">คีย์ลัด: Space พลิก · P ฟังเสียง</p>`}

function norm(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[\s'-]/g,''); }

    <div class="row" style="flex-wrap:wrap"><button class="btn" id="exp">ส่งออกไฟล์</button><button class="btn" id="imp">นำเข้าไฟล์</button><input type="file" id="file" accept="application/json" class="sr" aria-label="เลือกไฟล์สำรอง"><button class="btn" id="reset" style="color:#8A2414">${resetArm?'กดอีกครั้งเพื่อยืนยันการล้าง':'เริ่มใหม่ทั้งหมด'}</button></div>
  </div>
  <p class="small" style="margin:0 4px"><a href="privacy.html">นโยบายความเป็นส่วนตัว</a></p>
  <p class="small" style="color:var(--muted);margin:0 4px;line-height:1.6">ข้อมูลคำศัพท์: รายการ New HSK 1–9 (ไฟล์ที่ให้มา) · ความหมายภาษาอังกฤษบางส่วนและตัวเต็มจาก CC-CEDICT (CC BY-SA 4.0) · ความหมายภาษาไทยและตัวอย่างประโยค HSK 1 เขียนสำหรับแอปนี้</p></div>`;
  app.querySelector('#np').onchange=e=>{ st.newPerDay=Math.max(0,Math.min(200,+e.target.value||0)); save(); };
  app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; let v=b.dataset.v; if(v==='true')v=true; if(v==='false')v=false; st[k]=v; save(); renderSettings(); });
  app.querySelector('#exp').onclick=()=>{ try{ const blob=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hsk-flashcard-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); }catch(e){ toast('ส่งออกไม่สำเร็จ'); } };
  const file=app.querySelector('#file');
  app.querySelector('#imp').onclick=()=>file.click();
  file.onchange=()=>{ const f=file.files[0]; if(!f) return; f.text().then(t=>{ try{ const d=JSON.parse(t); if(!d.cards) throw 0; S=d; save(); toast('นำเข้าเรียบร้อย'); renderSettings(); }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); } }); };
  app.querySelector('#reset').onclick=()=>{ if(!resetArm){ resetArm=true; renderSettings(); setTimeout(()=>{resetArm=false; if(tab==='settings') renderSettings();},4000); return; } resetArm=false; S.cards={}; S.log={}; S.streak={last:-1,n:0}; cur=null; Q=[]; save(); toast('เริ่มใหม่แล้ว'); renderSettings(); };
}
// events
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.tab; document.getElementById('modal-root').innerHTML=''; render(); window.scrollTo(0,0); });
document.addEventListener('click',e=>{ const s=e.target.closest('[data-speak]'); if(s){ e.stopPropagation(); speak(s.dataset.speak); } });
app.addEventListener('keydown',()=>{});
document.addEventListener('keydown',e=>{
  if(tab!=='study'||!cur||e.target.matches('input,textarea')) return;
  if(e.key===' '&&!flipped){ e.preventDefault(); flip(); }
  else if(flipped && ['1','2','3','4'].includes(e.key)) rate(+e.key-1);
  else if(e.key==='p'||e.key==='P') speak(cur.s);
});
render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
})();
</script>
</body>
</html>
